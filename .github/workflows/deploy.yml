name: Build and security audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create and commit lockfile if missing
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: |
          npm install --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock npm dependency tree"
          git push
      - name: Install locked dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=low
      - name: Astro diagnostics
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Verify static output
        run: |
          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap-index.xml
