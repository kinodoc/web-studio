name: Build and security audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=low
      - name: Astro diagnostics
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Verify static output
        run: |
          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap-index.xml
